# ============================================================
# Laravel MongoDB Vector Search - Docker Compose Configuration
# ============================================================
# This file defines the development environment with two services:
# 1. nginx - Web server that handles HTTP requests
# 2. php - PHP-FPM service that runs Laravel application code
#
# Usage:
#   docker compose build              # Build the images
#   docker compose up -d              # Start containers in background
#   docker compose down               # Stop and remove containers
#   docker compose logs -f            # View logs
#
# Environment variables are loaded from .env file in this directory
# ============================================================

# Docker Compose file format version
version: '3.4'

# ============================================================
# Service Definitions
# ============================================================
services:

  # ------------------------------------------------------------
  # Nginx Web Server
  # ------------------------------------------------------------
  # Serves static files and proxies PHP requests to php-fpm
  nginx:
    # Use official nginx alpine image (lightweight)
    image: ${NGINX_IMAGE}

    # Port mapping: host:container
    # Exposes container port 80 to host port 80
    ports:
      - ${NGINX_HOST_PORT}:${NGINX_CONTAINER_PORT}

    # Volume mounts (host:container)
    volumes:
      # Mount the Laravel project - workspaceMount in devcontainer.json handles this
      # for the php service, but nginx needs its own mount
      # Using hardcoded folder name to match workspaceMount
      - ..:/workspaces/laravel-movies-retrieval-tutorial:cached

      # Mount nginx configuration files
      # This allows us to customize nginx settings without rebuilding
      - ${NGINX_HOST_CONFD_DIR}:${NGINX_CONTAINER_CONFD_DIR}

    # nginx depends on php service being available
    depends_on:
      - php

  # ------------------------------------------------------------
  # PHP-FPM Service
  # ------------------------------------------------------------
  # Runs the Laravel application code
  php:
    # Build configuration
    build:
      # Build context is the php folder containing Dockerfile
      context: ./.docker/php
      dockerfile: Dockerfile
      args:
        # Pass PHP version from .env to Dockerfile
        RUNTIME_PHP_IMAGE: ${PHP_IMAGE}

    # Tag the built image with this name
    image: ${PHP_IMAGE}

    # Default working directory inside the container
    # This is where commands run when you exec into the container
    working_dir: /workspaces/laravel-movies-retrieval-tutorial

    # Volume mounts
    # Note: The workspaceMount in devcontainer.json overrides this for the php service
    # This volume definition is kept for compatibility but workspaceMount takes precedence
    volumes:
      - ..:/workspaces/laravel-movies-retrieval-tutorial:cached

    # Note: Port 9000 (php-fpm) is not exposed externally
    # nginx communicates with php-fpm internally via Docker network
    # Xdebug uses port 9003 and connects FROM the container TO the IDE

# ============================================================
# Additional Notes
# ============================================================
# - Volume names can use environment variables from .env
# - Docker Compose automatically creates a network for services to communicate
# - Services can reach each other by service name (e.g., php:9000 from nginx)
# - The "cached" volume flag optimizes file sync on macOS/Windows
