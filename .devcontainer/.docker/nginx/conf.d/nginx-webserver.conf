# ============================================================
# Nginx Configuration for Laravel Application
# ============================================================
# This configuration serves a Laravel application via php-fpm
# It handles static files directly and proxies PHP requests to
# the php-fpm service running in the separate php container
# ============================================================

server {
    # --------------------------------------------------------
    # Listen Configuration
    # --------------------------------------------------------
    # Listen on port 80 for both IPv4 and IPv6
    listen 80;
    listen [::]:80 default_server;

    # Server name (domain) - not needed for local development
    # Uncomment and modify for production deployments
    # server_name example.com www.example.com;

    # --------------------------------------------------------
    # Document Root
    # --------------------------------------------------------
    # Point to Laravel's public directory
    # This is where index.php and public assets are located
    root /workspace/public;

    # --------------------------------------------------------
    # Security Headers
    # --------------------------------------------------------
    # Prevent clickjacking attacks
    add_header X-Frame-Options "SAMEORIGIN";
    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff";

    # --------------------------------------------------------
    # Index File
    # --------------------------------------------------------
    # Default file to serve (Laravel's front controller)
    index index.php;

    # Default charset for responses
    charset utf-8;

    # --------------------------------------------------------
    # Routing Configuration
    # --------------------------------------------------------
    # Laravel's routing: try file, directory, then route to index.php
    # This enables Laravel's routing system to handle all requests
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --------------------------------------------------------
    # Static Files
    # --------------------------------------------------------
    # Disable access logs for favicon and robots.txt
    # These files are frequently requested and don't need logging
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # --------------------------------------------------------
    # Error Handling
    # --------------------------------------------------------
    # Send 404 errors to Laravel's front controller
    error_page 404 /index.php;

    # --------------------------------------------------------
    # PHP-FPM Configuration
    # --------------------------------------------------------
    # Process all .php files through php-fpm
    # The php:9000 refers to the php service defined in docker-compose.yml
    location ~* \.php$ {
        # Forward PHP requests to php-fpm service
        # 'php' is the service name from docker-compose.yml
        # port 9000 is the default php-fpm port
        fastcgi_pass   php:9000;

        # Include standard fastcgi parameters
        include        fastcgi_params;

        # Tell php-fpm which script to execute
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  SCRIPT_NAME     $fastcgi_script_name;
    }

    # --------------------------------------------------------
    # Hidden Files Protection
    # --------------------------------------------------------
    # Deny access to hidden files (starting with .)
    # Except .well-known directory (used for SSL certificates, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}